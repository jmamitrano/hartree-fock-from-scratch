[project]
name = "hf-mp2"
version = "0.1.0"
description = "From-scratch implementation of Hartree-Fock and MP2 with Gaussian basis sets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pyscf>=2.14.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
